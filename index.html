function exportCSV(){let rows=[['Produto','Categoria','Quantidade','Unidade','Mínimo','Validade'],...data.items.map(i=>[i.name,i.cat,i.q,i.unit,i.min,i.date])];let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\n');let u=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));let a=document.createElement('a');a.href=u;a.download='sr-home-estoque.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function manualAdd(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let id=crypto.randomUUID();mutate(d=>{d.manual||=[];d.manual.push({id,name:f.name,q:+f.q,unit:f.unit,cat:f.cat})})}
function manualBuy(id){let i=(data.manual||[]).find(x=>x.id===id);if(!i)return;let market=prompt('Supermercado');if(market===null)return;let raw=prompt('Preço unitário');if(raw===null||!raw.trim())return;let price=Number(raw.replace(',','.'));if(!Number.isFinite(price)||price<0)return alert('Preço inválido');mutate(d=>{let x=d.manual.find(x=>x.id===id);if(!x)return;let existing=d.items.find(y=>y.name.toLowerCase()===x.name.toLowerCase()&&y.unit===x.unit);if(existing)existing.q+=x.q;else d.items.push({...x,min:0,date:''});d.purchases.push({name:x.name,unit:x.unit,q:x.q,price,market,date:new Date().toISOString(),by:auth.currentUser.uid});d.manual=d.manual.filter(y=>y.id!==id)})}
function enhance(){let m=$('#main'),a=data.items,p=data.purchases,low=a.filter(i=>i.q<i.min);let date=v=>v?new Date(v.length===10?v+'T12:00:00':v).toLocaleDateString('pt-BR'):'—';
if(tab==='Estoque')setSearch(search);
if(tab==='Compras'){m.innerHTML=`<h2>Lista de compras</h2><form onsubmit="manualAdd(event)"><input name="name" placeholder="Adicionar item" required><input name="q" type="number" min="0.01" step="any" value="1" required><input name="unit" value="un." required><select name="cat">${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select><button class="primary">Adicionar</button></form>`+cats.map(c=>{let items=low.filter(i=>i.cat===c),manual=(data.manual||[]).filter(i=>i.cat===c);return items.length||manual.length?`<h3>${esc(c)}</h3>`+items.map(i=>{let best=p.filter(x=>x.name===i.name&&x.unit===i.unit).sort((x,y)=>x.price-y.price)[0];return `<article><strong>${esc(i.name)}</strong><p>Comprar ${i.min-i.q} ${esc(i.unit)} · estoque ${i.q}</p>${best?`<small>Menor preço registrado: ${money(best.price)} · ${esc(best.market)} · ${date(best.date)}</small>`:''}<div class="row"><button class="primary" onclick="buy('${i.id}')">Comprei</button></div></article>`}).join('')+manual.map(i=>`<article>${esc(i.name)} · ${i.q} ${esc(i.unit)}<div class="row"><button onclick="manualBuy('${i.id}')">Comprei</button><button onclick="dropManual('${i.id}')">Remover</button></div></article>`).join(''):''}).join('')}
if(tab==='Gastos'){let list=p.filter(x=>x.date.slice(0,7)===month).sort((x,y)=>y.date.localeCompare(x.date));let total=list.reduce((s,x)=>s+x.q*x.price,0);m.innerHTML=`<h2>Gastos</h2><input type="month" value="${esc(month)}" onchange="setMonth(this.value)"><article><small>Total do mês</small><h2>${money(total)}</h2>${data.budget?`<small>Orçamento ${money(data.budget)} · saldo ${money(data.budget-total)}</small>`:''}</article>`+list.map(x=>`<article><strong>${esc(x.name)}</strong><p>${esc(x.market)} · ${date(x.date)}</p><small>${x.q} ${esc(x.unit)} × ${money(x.price)}</small><p>Total: ${money(x.q*x.price)}</p></article>`).join('')}
if(tab==='Validades'){m.innerHTML='<h2>Validades</h2><select onchange="filterExpiry(this.value)"><option value="all">Todas</option><option value="late">Vencidas</option><option value="soon">Próximas (7 dias)</option><option value="ok">Em dia</option></select>'+a.filter(i=>i.date&&i.q>0).sort((x,y)=>x.date.localeCompare(y.date)).map(i=>{let n=days(i.date),k=n<0?'late':n<=7?'soon':'ok';return `<article data-exp="${k}"><strong>${esc(i.name)}</strong><p>${date(i.date)}</p><span class="${k}">${n<0?'Vencido há '+(-n)+' dias':n===0?'Vence hoje':n+' dias restantes'}</span></article>`}).join('')}
if(tab==='Preços'){let groups=[...new Set(p.map(x=>JSON.stringify([x.name,x.unit])))];m.innerHTML='<h2>Comparativo de preços</h2><input placeholder="Buscar produto" oninput="filterPrice(this.value)">'+groups.map(k=>{let [name,unit]=JSON.parse(k),list=p.filter(x=>x.name===name&&x.unit===unit).sort((x,y)=>x.price-y.price),best=list[0],max=list.at(-1).price;return `<article class="price"><strong>${esc(name)} · ${esc(unit)}</strong><p>Menor registrado: ${money(best.price)} · ${esc(best.market)}</p><small>Diferença: ${money(max-best.price)} (${max?Math.round((max-best.price)/max*100):0}%)</small>${list.map(x=>`<p>${esc(x.market)} — ${money(x.price)} · ${date(x.date)} ${Date.now()-new Date(x.date)>30*86400000?'· preço antigo':''}</p>`).join('')}</article>`}).join('')}
if(tab==='Perfil'){let f=profile();m.innerHTML=`<h2>Meu perfil</h2><article><strong>Minha casa — Sedan & Rosa</strong><p>Renata e Raphael</p><small>${esc(auth.currentUser.email)}</small></article><form onsubmit="saveProfile(event)"><label>Nome <input name="name" value="${esc(f.name||'')}"></label><label>Foto (URL HTTPS) <input name="photo" type="url" value="${esc(f.photo||'')}"></label><label>Orçamento mensal <input name="budget" type="number" min="0" step="0.01" value="${data.budget||0}"></label><label><input type="checkbox" name="alerts" ${f.alerts!==false?'checked':''}> Alertas internos</label><button class="primary">Salvar perfil</button></form><div class="more"><button onclick="addCategory()">Nova categoria</button><button onclick="exportCSV()">Exportar estoque CSV</button><button onclick="resetPassword()">Alterar senha por e-mail</button><button onclick="document.querySelector('#logout').click()">Sair da conta</button></div>`}
if(tab==='Notificações'&&profile().alerts===false)m.innerHTML='<h2>Notificações</h2><p>Alertas desativados no perfil.</p>';
if(tab!=='Início')m.insertAdjacentHTML('afterbegin','<button class="back" onclick="back()">← Voltar</button>');
}
Object.assign(window,{back,setSearch,saveProfile,addCategory,resetPassword,exportCSV,manualAdd,manualBuy,dropManual:id=>mutate(d=>{d.manual=(d.manual||[]).filter(i=>i.id!==id)}),setMonth:v=>{month=v;render()},filterExpiry:v=>document.querySelectorAll('[data-exp]').forEach(el=>el.hidden=v!=='all'&&el.dataset.exp!==v),filterPrice:v=>document.querySelectorAll('.price').forEach(el=>el.hidden=!el.textContent.toLowerCase().includes(v.toLowerCase()))});

$('#login').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,e.target.email.value.trim(),e.target.senha.value);e.target.reset()}catch(err){$('#status').textContent='Erro no login: '+err.code}};
$('#logout').onclick=()=>signOut(auth).catch(e=>alert(e.code));
onAuthStateChanged(auth,user=>{unsub?.();stopScan();lastRendered="";ready=false;data={items:[],purchases:[]};$('#app').hidden=true;$('#login').hidden=!!user;$('#logout').hidden=true;$('#bell').hidden=!user;$('#slogan').hidden=!!user;$('#status').textContent=user?'Carregando estoque...':'Faça seu login.';if(user)unsub=onSnapshot(ref,{includeMetadataChanges:true},snap=>{data=snap.exists()?snap.data():{items:[],purchases:[]};ready=!snap.metadata.fromCache;$('#status').textContent=ready?'● Sincronizado':'Sem conexão — aguardando servidor';const first=$('#app').hidden;$('#app').hidden=false;if(first||!snap.metadata.hasPendingWrites&&JSON.stringify(data)!==lastRendered){lastRendered=JSON.stringify(data);render()}},e=>{$('#status').textContent='Erro no banco: '+e.code;ready=false})},e=>$('#status').textContent=e.message);
</script></html>
