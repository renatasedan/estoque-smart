<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estoque Smart</title><style>[hidden]{display:none!important} #status{color:#c5f477;font-size:14px} nav{position:sticky;top:0;background:#141c18;padding:8px 0;z-index:2} button{min-height:44px} *{box-sizing:border-box}body{background:#141c18;color:#f4f7f2;font:16px system-ui;margin:auto;max-width:700px;padding:20px}h1,h2{color:#c5f477}button,input,select{font:inherit;border:1px solid #52665a;border-radius:10px;padding:10px;background:#263b30;color:white}button{cursor:pointer}button.primary{background:#c5f477;color:#141c18;font-weight:bold}nav,form,.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}article{background:#22332a;border-radius:14px;padding:14px;margin:10px 0}small{color:#bdcfc1}input{max-width:100%;min-width:0}form input{flex:1 1 140px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stats article{margin:0}strong{color:#c5f477}video{width:100%}</style><style>body{padding:18px 16px 105px;max-width:700px}h1{font-size:25px;color:#f5f7f4;margin:8px 0}h2{font-size:21px;color:#f5f7f4}h1 span,strong{color:#c5f477}article{background:#26392e;border-radius:20px;padding:18px}nav{position:fixed;top:auto;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,700px);display:flex;flex-wrap:nowrap;justify-content:space-around;margin:0;padding:10px 6px calc(10px + env(safe-area-inset-bottom));background:#1b2921;border-top:1px solid #405448}nav button{border:0;background:transparent;flex:1;padding:5px 2px;font-size:11px;color:#a7b9ad}nav button span{display:block;font-size:23px;margin-bottom:4px}nav button.primary{background:transparent;color:#c5f477}button,input,select{border-radius:13px}#logout{position:absolute;right:16px;top:18px;font-size:12px}header{position:relative;padding-right:65px}#login{max-width:420px;margin:50px auto;display:grid;gap:14px}#login input{width:100%;padding:16px}#login button{padding:15px}.hero{background:#c5f477;color:#141c18}.hero h2,.hero small{color:#141c18}.hero h2{font-size:32px;margin:8px 0}.stats h2{font-size:30px;margin:8px 0}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.quick button{font-size:12px;padding:12px 4px}.quick span{display:block;font-size:24px;margin-bottom:6px}.categories{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}.categories button{font-size:11px;padding:8px 2px}.categories span{display:block;font-size:24px}.more button{display:block;width:100%;text-align:left;margin:9px 0;padding:16px}#add{background:#26392e;padding:14px;border-radius:18px}#status{font-size:12px}button:focus-visible{outline:2px solid #c5f477} .muted{color:#b8c9bd}</style><header><h1>⌂ Estoque <span>Smart</span></h1><small>Sua casa conectada. Sua rotina simplificada.</small><p id="status" role="status">Conectando...</p></header><form id="login" hidden><h2>Bem-vinda de volta!</h2><small>Acesse sua conta para organizar sua casa.</small><input name="email" type="email" placeholder="E-mail" required><input name="senha" type="password" placeholder="Senha" required><button class="primary">Entrar</button></form><button id="logout" hidden>Sair</button><section id="app" hidden><nav id="nav"></nav><main id="main"></main></section><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js';
import {getFirestore,doc,onSnapshot,runTransaction} from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js';
const firebaseConfig = {
    apiKey: "AIzaSyDtl3jsIWUny6wSToLoREErgGKLg-bNj3k",
    authDomain: "casa-smart-683e3.firebaseapp.com",
    projectId: "casa-smart-683e3",
    appId: "1:705985701779:web:b522be17a5faef0642aa66"
  };
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),ref=doc(db,'estoqueSmart','casa');
let unsub,ready=false,busy=false;
async function mutate(fn){if(!ready||busy)return;busy=true;try{await runTransaction(db,async tx=>{const snap=await tx.get(ref);const d=snap.exists()?snap.data():{items:[],purchases:[]};fn(d);tx.set(ref,d)});}catch(e){alert('Não foi possível salvar: '+e.code)}finally{busy=false}}

const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data={items:[],purchases:[]},tab='Início';const cats=['Despensa','Geladeira','Freezer','Hortifruti','Limpeza','Higiene','Bebidas'];const money=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});function days(d){return d?Math.round((new Date(d+'T12:00:00')-new Date(new Date().toDateString()+' 12:00:00'))/86400000):Infinity}
function change(id,n){mutate(d=>{let i=d.items.find(x=>x.id===id);if(i)i.q=Math.max(0,i.q+n)})}
function remove(id){if(confirm('Excluir produto?'))mutate(d=>{d.items=d.items.filter(x=>x.id!==id)})}
function buy(id){let i=data.items.find(x=>x.id===id);if(!i)return;let q=Number(prompt('Quantidade comprada',Math.max(1,i.min-i.q)));if(!Number.isFinite(q)||q<=0)return;let market=prompt('Supermercado');if(market===null)return;let raw=prompt('Preço por unidade (R$)');if(raw===null)return;let price=Number(raw.replace(',','.'));if(!raw.trim()||!Number.isFinite(price)||price<0)return alert('Preço inválido');let date=new Date().toISOString();mutate(d=>{let x=d.items.find(x=>x.id===id);if(!x)throw Error('Produto excluído');x.q+=q;d.purchases.push({name:x.name,q,price,market,date})})}
function render(){ $('#nav').innerHTML=['Início','Estoque','Compras','Gastos','Mais'].map((t,j)=>`<button class="${t===tab?'primary':''}" onclick="go('${t}')"><span>${['⌂','▣','🛒','▤','☰'][j]}</span>${t}</button>`).join('');let a=data.items,low=a.filter(i=>i.q<i.min),exp=a.filter(i=>i.q>0&&days(i.date)<=7),p=data.purchases,m=$('#main');if(tab==='Início'){let total=p.filter(x=>x.date.slice(0,7)===new Date().toISOString().slice(0,7)).reduce((s,x)=>s+x.q*x.price,0);m.innerHTML=`<h2>Olá, bem-vindo(a)! 👋</h2><p class="muted">Tudo sob controle.</p><article class="hero" onclick="go('Gastos')"><small>Gastos do mês</small><h2>${money(total)}</h2><small>Acompanhe suas despesas domésticas</small></article><div class="stats">${[['📦','Em estoque',a.length,'Estoque'],['🛒','Para comprar',low.length,'Compras'],['📅','Vencendo',exp.length,'Validades'],['⚠️','Estoque baixo',low.length,'Estoque']].map(([icon,k,v,t])=>`<article onclick="go('${t}')"><span>${icon}</span><h2>${v}</h2><small>${k}</small></article>`).join('')}</div><h2>Acesso rápido</h2><div class="quick"><button onclick="go('Estoque');scan()"><span>▥</span>Escanear</button><button onclick="go('Estoque')"><span>＋</span>Cadastrar</button><button onclick="go('Gastos')"><span>▤</span>Gastos</button></div><h2>Categorias</h2><div class="categories">${cats.map((c,j)=>`<button onclick="go('Estoque');document.querySelector('#search').value='${c}';filterProducts()"><span>${['🍚','🥛','🧊','🥬','🧹','🧴','🥤'][j]}</span>${c}</button>`).join('')}</div>`}if(tab==='Mais'){m.innerHTML='<h2>Mais funcionalidades</h2><div class="more">'+['Validades','Preços','Receitas','Notificações','Perfil'].map(t=>`<button onclick="go('${t}')">${t}　›</button>`).join('')+'</div>'}if(tab==='Perfil'){m.innerHTML=`<h2>Meu perfil</h2><article>${esc(auth.currentUser?.email)}<p>Estoque compartilhado</p></article><button onclick="document.querySelector('#logout').click()">Sair da conta</button>`}if(tab==='Notificações'){m.innerHTML='<h2>Notificações</h2>'+[...low.map(i=>`<article>Estoque baixo: ${esc(i.name)}</article>`),...exp.map(i=>`<article>Validade: ${esc(i.name)} — ${esc(i.date)}</article>`)].join('')+'<small>Alertas internos. Push ainda não configurado.</small>'}if(tab==='Estoque'){m.innerHTML=`<h2>Cadastrar produto</h2><form id="add"><input name="name" placeholder="Produto" required><select name="cat">${cats.map(c=>`<option>${c}</option>`)}</select><input name="q" type="number" min="0" step="any" placeholder="Quantidade" required><input name="min" type="number" min="0" step="any" placeholder="Estoque mínimo" required><input name="unit" placeholder="Unidade (kg, L, un.)" required><label>Validade <input name="date" type="date"></label><input name="code" placeholder="Código de barras"><button type="button" onclick="scan()">Ler código</button><button class="primary">Salvar</button></form><video id="video" hidden></video><h2>Meus produtos</h2><input id="search" placeholder="Buscar produto ou categoria" oninput="filterProducts()">${a.map(i=>`<article class="product"><strong>${esc(i.name)}</strong> · ${esc(i.cat)}<p>${i.q} ${esc(i.unit)} · mínimo ${i.min}</p><div class="row"><button onclick="change('${i.id}',-1)">−</button><button onclick="change('${i.id}',1)">+</button><button onclick="buy('${i.id}')">Registrar compra</button><button onclick="remove('${i.id}')">Excluir</button></div></article>`).join('')}`;$('#add').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));const id=crypto.randomUUID();mutate(d=>d.items.push({...f,id,q:+f.q,min:+f.min}))}}if(tab==='Compras')m.innerHTML='<h2>Lista automática</h2>'+(low.map(i=>`<article>${esc(i.name)} — ${i.min-i.q} ${esc(i.unit)} <button onclick="buy('${i.id}')">Comprei</button></article>`).join('')||'Nenhum item abaixo do mínimo.');if(tab==='Validades')m.innerHTML='<h2>Validades</h2>'+ (a.filter(i=>i.date&&i.q>0).sort((x,y)=>x.date.localeCompare(y.date)).map(i=>`<article>${esc(i.name)} · ${esc(i.date)} · ${days(i.date)<0?'Vencido':days(i.date)<=7?'Atenção':'OK'}</article>`).join('')||'Nenhuma validade cadastrada.');if(tab==='Gastos')m.innerHTML='<h2>Histórico de compras</h2>'+ (p.map(x=>`<article>${esc(x.name)} · ${esc(x.market)}<p>${money(x.q*x.price)} · ${new Date(x.date).toLocaleDateString('pt-BR')}</p></article>`).join('')||'Nenhuma compra registrada.');if(tab==='Preços')m.innerHTML='<h2>Preços registrados por unidade</h2>'+([...new Set(p.map(x=>x.name))].map(n=>`<article><strong>${esc(n)}</strong>${p.filter(x=>x.name===n).sort((a,b)=>a.price-b.price).map(x=>`<p>${esc(x.market)} — ${money(x.price)} · ${new Date(x.date).toLocaleDateString('pt-BR')}</p>`).join('')}</article>`).join('')||'Registre compras para comparar preços.');if(tab==='Receitas'){let recipes=[['Arroz com frango',['arroz','frango']],['Omelete',['ovo']],['Macarrão ao tomate',['macarrão','tomate']],['Salada simples',['alface','tomate']]];m.innerHTML='<h2>Ideias de refeições</h2>'+recipes.map(([n,ings])=>{let missing=ings.filter(k=>!a.some(i=>i.q>0&&i.name.toLowerCase().includes(k)));return `<article><strong>${n}</strong><p>${missing.length?'Faltam: '+missing.join(', '):'Ingredientes básicos disponíveis'}</p></article>`}).join('')}}async function scan(){if(!('BarcodeDetector'in window)||!navigator.mediaDevices)return alert('Leitor não disponível neste navegador. Digite o código manualmente.');let stream;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});let v=$('#video');v.hidden=false;v.srcObject=stream;await v.play();let d=new BarcodeDetector();let timer=setInterval(async()=>{try{if(!v.isConnected){clearInterval(timer);stream.getTracks().forEach(t=>t.stop());return}let r=await d.detect(v);if(r.length){$('#add [name=code]').value=r[0].rawValue;clearInterval(timer);stream.getTracks().forEach(t=>t.stop());v.hidden=true}}catch{}},300);setTimeout(()=>{clearInterval(timer);stream.getTracks().forEach(t=>t.stop());v.hidden=true},30000)}catch{stream?.getTracks().forEach(t=>t.stop());alert('Não foi possível acessar a câmera.')} }
function filterProducts(){let q=$('#search')?.value.toLowerCase()||'';document.querySelectorAll('.product').forEach(el=>el.hidden=!el.textContent.toLowerCase().includes(q))}
Object.assign(window,{filterProducts,go:t=>{tab=t;render()},change,remove,buy,scan});
$('#login').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,e.target.email.value.trim(),e.target.senha.value);e.target.reset()}catch(err){$('#status').textContent='Erro no login: '+err.code}};
$('#logout').onclick=()=>signOut(auth).catch(e=>alert(e.code));
onAuthStateChanged(auth,user=>{unsub?.();ready=false;data={items:[],purchases:[]};$('#app').hidden=true;$('#login').hidden=!!user;$('#logout').hidden=!user;$('#status').textContent=user?'Carregando estoque...':'Faça seu login.';if(user)unsub=onSnapshot(ref,{includeMetadataChanges:true},snap=>{data=snap.exists()?snap.data():{items:[],purchases:[]};ready=!snap.metadata.fromCache;$('#status').textContent=ready?'● Sincronizado':'Sem conexão — aguardando servidor';$('#app').hidden=false;render()},e=>{$('#status').textContent='Erro no banco: '+e.code;ready=false})},e=>$('#status').textContent=e.message);
</script></html>
