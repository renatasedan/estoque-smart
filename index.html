async function lookup(){openAdd();const f=$('#add');if(!f)return;const code=f.elements.code.value.trim();const status=$('#lookupStatus');if(!/^\d{8,14}$/.test(code)){status.textContent='Digite um código de 8 a 14 números.';return;}const local=data.items.find(i=>i.code===code);if(local){f.elements.name.value=local.name;f.elements.cat.value=drink26(local.name)?'Bebidas':local.cat;f.elements.unit.value=local.unit;f.elements.brand.value=local.brand||'';f.elements.size.value=local.size||'';f.elements.image.value=local.image||'';status.textContent='Encontrado no seu estoque. Confira antes de salvar.';return;}status.textContent='Consultando catálogo público...';for(const host of ['world.openfoodfacts.org','world.openproductsfacts.org']){try{const r=await fetch('https://'+host+'/api/v2/product/'+code+'.json?fields=product_name,product_name_pt,brands,quantity,image_front_small_url',{signal:AbortSignal.timeout(8000)});if(!r.ok)continue;const j=await r.json(),p=j.product;if(j.status===1&&p&&(p.product_name_pt||p.product_name)){if(!f.isConnected||f.elements.code.value.trim()!==code)return;f.elements.name.value=p.product_name_pt||p.product_name;f.elements.brand.value=p.brands||'';f.elements.size.value=p.quantity||'';f.elements.image.value=p.image_front_small_url||'';if(drink26(f.elements.name.value))f.elements.cat.value='Bebidas';status.textContent='Produto encontrado! Confira os dados e complete o cadastro.';return;}}catch{}}status.textContent='Não encontrado ou catálogo indisponível. Complete manualmente.';}
async function scan(){
 openAdd();stopScan();const epoch=scanEpoch,v=$('#video'),panel=$('#scanner');

function openConsume27(id){let i=data.items.find(x=>x.id===id);if(!i||i.q<=0)return;document.querySelector('#consumeDialog27')?.remove();let el=document.createElement('dialog');el.id='consumeDialog27';let q=Math.min(1,i.q),round=v=>Math.round(v*1e6)/1e6;el.innerHTML=`<div class="consumeHead271"><h2>Registrar consumo</h2><button type="button" aria-label="Fechar" data-close>×</button></div><div class="p25">${photo25(i)}<div><strong>${esc(i.name)}</strong><br><small>Disponível: ${esc(unit25(i.q,i.unit))}</small></div></div><p class="consumeLabel271">Quantidade consumida</p><div class="consumeStep271"><button type="button" data-minus aria-label="Diminuir quantidade">−</button><output></output><button type="button" data-plus aria-label="Aumentar quantidade">+</button></div><div class="consumeBalance271"><small>Estoque após consumo</small><strong id="balance27"></strong></div><div class="stockActions271"><button type="button" data-cancel>Cancelar</button><button type="button" class="primary" data-confirm>Confirmar</button></div>`;document.body.append(el);let get=k=>el.querySelector(k);let update=()=>{get('output').textContent=q;get('#balance27').textContent=unit25(round(i.q-q),i.unit);get('[data-minus]').disabled=q<=Math.min(1,i.q);get('[data-plus]').disabled=q>=i.q};get('[data-minus]').onclick=()=>{q=Math.max(Math.min(1,i.q),round(q-1));update()};get('[data-plus]').onclick=()=>{q=Math.min(i.q,round(q+1));update()};get('[data-close]').onclick=get('[data-cancel]').onclick=()=>el.close();get('[data-confirm]').onclick=async()=>{if(!ready||busy)return alert('Aguarde a sincronização');get('[data-confirm]').disabled=true;await mutate(d=>movement27(d,id,q,'Consumo'));el.close()};el.onclose=()=>el.remove();update();el.showModal()}
function history27(id){let i=data.items.find(x=>x.id===id);if(!i)return;document.querySelector('#historyDialog27')?.remove();let el=document.createElement('dialog');el.id='historyDialog27';let rows=[...(data.movements||[]).filter(x=>x.itemId===id),...data.purchases.filter(x=>x.itemId===id||(!x.itemId&&norm25(x.name)===norm25(i.name))).map(x=>({...x,reason:'Compra',purchase:true}))].sort((a,b)=>String(b.date).localeCompare(String(a.date)));el.innerHTML=`<h2>Movimentações</h2><p>${esc(i.name)}</p>${rows.map(x=>`<article><strong>${x.q>0?'+':''}${esc(x.q)} · ${esc(x.reason)}</strong><br><small>${esc(new Date(x.date).toLocaleString('pt-BR'))} · ${esc(data.profiles?.[x.by]?.name||(x.by===auth.currentUser.uid?'Você':'Outro usuário'))}</small>${!x.purchase&&x.q<0&&!x.undone?`<br><button data-id="${esc(x.id)}" onclick="undo27(this.dataset.id)">Desfazer saída</button>`:''}${x.undone?' · Estornada':''}</article>`).join('')||'<p>Sem movimentações registradas.</p>'}<button onclick="this.closest('dialog').close()">Fechar</button>`;document.body.append(el);el.onclose=()=>el.remove();el.showModal()}
function undo27(id){if(!confirm('Devolver quantidade ao estoque?'))return;document.querySelector('#historyDialog27')?.close();mutate(d=>{let x=(d.movements||[]).find(m=>m.id===id);if(!x||x.undone||x.q>=0)throw Error('Saída já estornada ou inválida');let i=d.items.find(y=>y.id===x.itemId);if(!i)throw Error('Produto excluído');i.q-=x.q;x.undone=true;log27(d,i,-x.q,'Estorno de saída')})}
Object.assign(window,{openConsume27,history27,undo27});
