put name="email" type="email" placeholder="E-mail" required><input name="senha" type="password" placeholder="Senha" required><button class="primary">Entrar</button></form><button id="logout" hidden>Sair</button><section id="app" hidden><nav id="nav"></nav><main id="main"></main></section><script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script><script type="module">

async function mutate(fn){if(!ready||busy)return;busy=true;try{await runTransaction(db,async tx=>{const snap=await tx.get(ref);const d=snap.exists()?snap.data():{items:[],purchases:[]};fn(d);tx.set(ref,d)});}catch(e){alert('Não foi possível salvar: '+e.code)}finally{busy=false}}

const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data={items:[],purchases:[]},tab='Início';const cats=['Despensa','Geladeira','Freezer','Hortifruti','Limpeza','Higiene','Bebidas'];const money=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});function days(d){return d?Math.round((new Date(d+'T12:00:00')-new Date(new Date().toDateString()+' 12:00:00'))/86400000):Infinity}

function buy(id){let i=data.items.find(x=>x.id===id);if(!i)return;let q=Number(prompt('Quantidade comprada',Math.max(1,i.min-i.q+1)));if(!Number.isFinite(q)||q<=0)return;let market=prompt('Supermercado');if(market===null)return;let raw=prompt('Preço por unidade (R$)');if(raw===null)return;let price=Number(raw.replace(',','.'));if(!raw.trim()||!Number.isFinite(price)||price<0)return alert('Preço inválido');let date=new Date().toISOString();mutate(d=>{let x=d.items.find(x=>x.id===id);if(!x)throw Error('Produto excluído');x.q+=q;d.purchases.push({name:x.name,unit:x.unit,q,price,market,date,by:auth.currentUser.uid})})}

function render(){stopScan(); $('#nav').innerHTML=['Início','Estoque','Compras','Gastos','Mais'].map((t,j)=>`<button class="${t===tab?'primary':''}" onclick="go('${t}')"><span>${['home','box','cart','receipt','menu'].map(iconSvg)[j]}</span>${t}</button>`).join('');let a=data.items,low=a.filter(i=>i.q<=i.min),exp=a.filter(i=>i.q>0&&days(i.date)<=7),p=data.purchases,m=$('#main');if(tab==='Início'){let total=p.filter(x=>x.date.slice(0,7)===new Date().toISOString().slice(0,7)).reduce((s,x)=>s+x.q*x.price,0);m.innerHTML=`<h2>Olá, bem-vindo(a)!</h2><p class="muted">Tudo sob controle.</p><article class="hero" onclick="go('Gastos')"><small>Gastos do mês</small><h2>${money(total)}</h2><small>Acompanhe suas despesas domésticas</small></article><div class="stats">${[['box','Em estoque',a.length,'Estoque'],['cart','Para comprar',low.length,'Compras'],['calendar','Vencendo',exp.length,'Validades'],['alert','Estoque baixo',low.length,'Estoque']].map(([icon,k,v,t])=>`<article onclick="go('${t}')"><span>${iconSvg(icon)}</span><h2>${v}</h2><small>${k}</small></article>`).join('')}</div><h2>Acesso rápido</h2><div class="quick"><button onclick="go('Estoque');scan()"><span><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8V3h5m8 0h5v5m0 8v5h-5m-8 0H3v-5M7 8v8m3-8v8m4-8v8m3-8v8"/></svg></span>Escanear</button><button onclick="go('Estoque');openAdd()"><span><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>Cadastrar</button><button onclick="go('Gastos')"><span><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h14v18l-3-2-4 2-4-2-3 2zM8 8h8M8 12h8M8 16h5"/></svg></span>Gastos</button></div><h2>Categorias</h2><div class="categories">${cats.map((c,j)=>`<button onclick="go('Estoque');document.querySelector('#search').value='${c}';filterProducts()"><span>${['box','fridge','snow','leaf','clean','bottle','cup'].map(iconSvg)[j]}</span>${c}</button>`).join('')}</div>`}if(tab==='Mais'){m.innerHTML='<h2>Mais funcionalidades</h2><div class="more">'+['Validades','Preços','Receitas','Notificações','Perfil'].map(t=>`<button onclick="go('${t}')">${iconSvg(({Validades:"calendar",Preços:"tag",Receitas:"chef",Notificações:"bell",Perfil:"user"})[t])}<span>${t}</span>${iconSvg("chevron")}</button>`).join('')+'</div>'}if(tab==='Perfil'){m.innerHTML=`<h2>Meu perfil</h2><article>${esc(auth.currentUser?.email)}<p>Estoque compartilhado</p></article><button onclick="document.querySelector('#logout').click()">Sair da conta</button>`}if(tab==='Notificações'){m.innerHTML='<h2>Notificações</h2>'+[...low.map(i=>`<article>Estoque baixo: ${esc(i.name)}</article>`),...exp.map(i=>`<article>Validade: ${esc(i.name)} — ${esc(i.date)}</article>`)].join('')+'<small>Alertas internos. Push ainda não configurado.</small>'}if(tab==='Estoque'){m.innerHTML=`<div class="row" style="justify-content:space-between;align-items:center"><h2>Meus produtos</h2><button class="primary" onclick="openAdd()"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> Cadastrar</button></div><form id="add" hidden><input name="name" placeholder="Produto" required><select name="cat">${cats.map(c=>`<option>${c}</option>`)}</select><input name="q" type="number" min="0" step="any" placeholder="Quantidade" required><input name="min" type="number" min="0" step="any" placeholder="Estoque mínimo" required><input name="unit" placeholder="Unidade (kg, L, un.)" required><label>Validade <input name="date" type="date"></label><input name="code" inputmode="numeric" placeholder="Código de barras"><button type="button" onclick="lookup()">Buscar código</button><input name="brand" placeholder="Marca (opcional)"><input name="size" placeholder="Peso / volume da embalagem"><input name="image" type="hidden"><p id="lookupStatus" role="status"></p><button type="button" onclick="scan()">Ler código</button><button class="primary">Salvar</button></form><div id="scanner" hidden><video id="video" playsinline muted></video><button onclick="stopScan()">Fechar câmera</button></div><input id="search" placeholder="Buscar produto ou categoria" oninput="filterProducts()">${a.map(i=>`<article class="product">${i.image&&/^https:\/\//.test(i.image)?`<img class="thumb" src="${esc(i.image)}" alt="">`:""}<strong>${esc(i.name)}</strong> · ${esc(i.cat)}<p>${esc(i.brand||"")} ${esc(i.size||"")}</p><p>${i.q} ${esc(i.unit)} · mínimo ${i.min}</p><div class="row"><button onclick="change('${i.id}',-1)">−</button><button onclick="change('${i.id}',1)">+</button><button onclick="buy('${i.id}')">Registrar compra</button><button onclick="remove('${i.id}')">Excluir</button></div></article>`).join('')}`;$('#add').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));const id=crypto.randomUUID();mutate(d=>d.items.push({...f,id,q:+f.q,min:+f.min}))}}if(tab==='Compras')m.innerHTML='<h2>Lista automática</h2>'+(low.map(i=>`<article>${esc(i.name)} — ${Math.max(1,i.min-i.q+1)} ${esc(i.unit)} <button onclick="buy('${i.id}')">Comprei</button></article>`).join('')||'Nenhum item precisa de reposição.');if(tab==='Validades')m.innerHTML='<h2>Validades</h2>'+ (a.filter(i=>i.date&&i.q>0).sort((x,y)=>x.date.localeCompare(y.date)).map(i=>`<article>${esc(i.name)} · ${esc(i.date.split("-").reverse().join("/"))} · ${days(i.date)<0?'Vencido':days(i.date)<=7?'Atenção':'OK'}</article>`).join('')||'Nenhuma validade cadastrada.');if(tab==='Gastos')m.innerHTML='<h2>Histórico de compras</h2>'+ (p.map(x=>`<article>${esc(x.name)} · ${esc(x.market)}<p>Quantidade: ${x.q} ${esc(x.unit||'un.')}<br>Valor unitário: ${money(x.price)}<br><strong>Total: ${money(x.q*x.price)}</strong><br>${new Date(x.date).toLocaleDateString('pt-BR')}</p></article>`).join('')||'Nenhuma compra registrada.');if(tab==='Preços')m.innerHTML='<h2>Preços registrados por unidade</h2>'+([...new Set(p.map(x=>x.name))].map(n=>`<article><strong>${esc(n)}</strong>${p.filter(x=>x.name===n).sort((a,b)=>a.price-b.price).map(x=>`<p>${esc(x.market)} — ${money(x.price)} · ${new Date(x.date).toLocaleDateString('pt-BR')}</p>`).join('')}</article>`).join('')||'Registre compras para comparar preços.');if(tab==='Receitas'){let recipes=[['Arroz com frango',['arroz','frango']],['Omelete',['ovo']],['Macarrão ao tomate',['macarrão','tomate']],['Salada simples',['alface','tomate']]];m.innerHTML='<h2>Ideias de refeições</h2>'+recipes.map(([n,ings])=>{let missing=ings.filter(k=>!a.some(i=>i.q>0&&i.name.toLowerCase().includes(k)));return `<article><strong>${n}</strong><p>${missing.length?'Faltam: '+missing.join(', '):'Ingredientes básicos disponíveis'}</p></article>`}).join('')}}let scanControl=null,scanEpoch=0;
function openAdd(){const f=$('#add');if(f)f.hidden=false;}
function stopScan(){scanEpoch++;scanControl?.stop();scanControl=null;const v=$('#video');v?.srcObject?.getTracks().forEach(t=>t.stop());if($('#scanner'))$('#scanner').hidden=true;}
async function lookup(){openAdd();const f=$('#add');if(!f)return;const code=f.elements.code.value.trim();const status=$('#lookupStatus');if(!/^\d{8,14}$/.test(code)){status.textContent='Digite um código de 8 a 14 números.';return;}const local=data.items.find(i=>i.code===code);if(local){f.elements.name.value=local.name;f.elements.cat.value=local.cat;f.elements.unit.value=local.unit;f.elements.brand.value=local.brand||'';f.elements.size.value=local.size||'';f.elements.image.value=local.image||'';status.textContent='Encontrado no seu estoque. Confira antes de salvar.';return;}status.textContent='Consultando catálogo público...';for(const host of ['world.openfoodfacts.org','world.openproductsfacts.org']){try{const r=await fetch('https://'+host+'/api/v2/product/'+code+'.json?fields=product_name,product_name_pt,brands,quantity,image_front_small_url',{signal:AbortSignal.timeout(8000)});if(!r.ok)continue;const j=await r.json(),p=j.product;if(j.status===1&&p&&(p.product_name_pt||p.product_name)){if(!f.isConnected||f.elements.code.value.trim()!==code)return;f.elements.name.value=p.product_name_pt||p.product_name;f.elements.brand.value=p.brands||'';f.elements.size.value=p.quantity||'';f.elements.image.value=p.image_front_small_url||'';status.textContent='Produto encontrado! Confira os dados e complete o cadastro.';return;}}catch{}}status.textContent='Não encontrado ou catálogo indisponível. Complete manualmente.';}
async function scan(){openAdd();stopScan();const epoch=scanEpoch;const v=$('#video');if(!v||!window.ZXingBrowser||!navigator.mediaDevices?.getUserMedia)return alert('Câmera ou leitor indisponível. Digite o código manualmente.');$('#scanner').hidden=false;try{const reader=new ZXingBrowser.BrowserMultiFormatReader();const control=await reader.decodeFromConstraints({video:{facingMode:{ideal:'environment'}},audio:false},v,(result,error,controls)=>{if(epoch!==scanEpoch||!v.isConnected){controls.stop();return;}if(result){$('#add').elements.code.value=result.getText();controls.stop();stopScan();lookup();}});if(epoch!==scanEpoch||!v.isConnected)control.stop();else scanControl=control;}catch(e){if(epoch===scanEpoch){stopScan();alert('Não foi possível abrir a câmera. Confira a permissão ou digite o código.');}}}
function filterProducts(){let q=$('#search')?.value.toLowerCase()||'';document.querySelectorAll('.product').forEach(el=>el.hidden=!el.textContent.toLowerCase().includes(q))}
